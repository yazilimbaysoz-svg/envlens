[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "envlens"
version = "0.1.0"
description = "X-ray vision for environment variables: catch drift, leaks and missing config before deployment."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Baysoz Yazilim", email = "baysmuslum509@gmail.com" }]
keywords = [
  "environment-variables",
  "devtools",
  "security",
  "config-drift",
  "secrets-detection",
  "ci-cd",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Security",
]
dependencies = []

[project.scripts]
envlens = "envlens.cli:main"

[project.urls]
Homepage = "https://github.com/yazilimbaysoz-svg/envlens"
Repository = "https://github.com/yazilimbaysoz-svg/envlens"
Issues = "https://github.com/yazilimbaysoz-svg/envlens/issues"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/envlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PTH", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108"]
"sosyal_medya/**" = ["S101", "S108", "RUF001", "RUF002", "RUF003"]

[tool.envlens]
exclude = ["tests", "sosyal_medya"]
ignore = []
